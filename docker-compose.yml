# Local infrastructure for DevHub / FE Panel.
#   docker compose up -d      -> Postgres on localhost:5432 and a self-hosted SuperTokens core on localhost:3567
#   docker compose up -d db   -> only Postgres (use with SUPERTOKENS_CONNECTION_URI=https://try.supertokens.com)
# The frontend and backend run on your machine with npm (see README.md).
# Images and the host port can be overridden, e.g.
#   POSTGRES_PORT=5433 POSTGRES_IMAGE=postgres:16-alpine docker compose up -d db
# (then use localhost:5433 in backend/.env DATABASE_URL). Put these in a root .env file to make them stick.
name: devhub

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub # local development only
      POSTGRES_DB: devhub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devhub-pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted SuperTokens core (passwordless phone OTP). Stores its data in the "supertokens"
  # database of the same Postgres. Alternative: set SUPERTOKENS_CONNECTION_URI=https://try.supertokens.com
  # in backend/.env to use SuperTokens' public demo core instead (no container needed).
  supertokens:
    image: ${SUPERTOKENS_IMAGE:-registry.supertokens.io/supertokens/supertokens-postgresql:12.2}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://devhub:devhub@db:5432/supertokens
    ports:
      - "3567:3567"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e \"GET /hello HTTP/1.1\\r\\nhost: 127.0.0.1:3567\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"Hello\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  devhub-pg:
