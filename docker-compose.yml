# Local database for DevHub / FE Panel.
#   docker compose up -d      -> Postgres on localhost:5432 (user / password / db: devhub)
# The frontend and backend run on your machine with npm (see README.md).
# The image and host port can be overridden, e.g. in a root .env file (git-ignored):
#   POSTGRES_PORT=5433
#   POSTGRES_IMAGE=postgres:16-alpine
# (then use localhost:5433 in backend/.env DATABASE_URL).
name: devhub

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub # local development only
      POSTGRES_DB: devhub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devhub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devhub-pg:
